name: repair-lite
description: >
  Lightweight 4-stage REPAIR pipeline (research -> plan -> implement -> review)
  for smoke tests and quick iterations. Skips Discovery, Evaluate, and
  Architecture stages. Same evaluator loop on the Review stage.

tags:
  - repair
  - lite

parameters:
  - key: objective
    type: string
    required: true
    description: What to build or fix

tasks:
  - id: research
    agent: gemini
    type: repair.research
    description: Quick research
    prompt_template: |
      You are the research stage of a lightweight REPAIR pipeline.
      Investigate the following objective and return a concise summary
      (under 500 words) of relevant approaches, libraries, and gotchas.

      Objective: {{objective}}
    timeout: 10m

  - id: plan
    agent: claude
    type: repair.plan
    description: Short implementation plan
    depends_on:
      - research
    context_from:
      - research
    prompt_template: |
      You are the plan stage. Based on the research above, produce a
      concise implementation plan with 3-5 numbered steps. Each step
      should be directly actionable by an implementation agent.

      If the objective is unrecoverably vague, contradictory, or missing
      essential details (e.g. a single word like "add" with no target),
      do NOT silently produce a generic plan. Instead, your output MUST
      begin with a top-level heading:

          # BLOCKED — objective is unrecoverable

      followed by one paragraph explaining what information is missing.
      The downstream review stage will recognize this marker and abort
      the pipeline instead of wasting retry attempts on a doomed run.

      Objective: {{objective}}
    timeout: 10m

  - id: implement
    agent: codex
    type: repair.implement
    description: Write the code
    depends_on:
      - plan
    context_from:
      - plan
    prompt_template: |
      You are the implementation stage. Write code that implements the
      plan above. Provide runnable code with file paths and imports.

      Objective: {{objective}}
    timeout: 20m

  - id: review
    agent: claude
    type: repair.review
    description: Adversarial review
    depends_on:
      - implement
    context_from:
      - research
      - plan
      - implement
    evaluator_of: implement
    evaluator_retries: 2
    prompt_template: |
      You are the adversarial reviewer. Review the implementation above
      against the plan and research that produced it.

      Your FIRST line must be EXACTLY one of:
        ACCEPT: <one-line summary>
        REJECT: <one-line specific fixable issue>
        BLOCKED: <one-line reason the input cannot produce useful work>

      Use BLOCKED (not REJECT) when:
      - The objective is unrecoverably vague, contradictory, or missing
        essential details (e.g. a single word like "add" with no target).
      - The plan stage above explicitly flagged the input as too vague
        to plan against, and the implementer nevertheless produced
        arbitrary work to fill the void.
      - The implementation addresses a different goal than what the user
        asked for because the actual goal was undefined.
      - No amount of retrying can rescue the situation.

      Use REJECT for fixable issues (missing tests, wrong API, bad edge
      cases, incomplete logic) that a retry with feedback could address.

      Use ACCEPT only if the code runs, matches the objective, matches
      the plan, and handles obvious edge cases.

      If uncertain between REJECT and BLOCKED, prefer REJECT — a false
      BLOCKED loses work a retry could have fixed; a false REJECT only
      costs one retry attempt.

      Objective: {{objective}}
    timeout: 10m

name: repo-audit
description: Full audit of a repository - architecture, dependencies, security
agent: claude
tags:
  - review
  - audit
  - security

system_prompt: |
  You are a repository auditor. Perform a comprehensive audit of the codebase:

  Target: {{target}}

  Analyze:
  1. Architecture overview (packages, dependencies, data flow)
  2. Dependency audit (outdated, vulnerable, unnecessary)
  3. Security scan (hardcoded secrets, injection points, auth issues)
  4. Code quality (test coverage, error handling, documentation)
  5. Performance concerns (N+1 queries, unbounded allocations, blocking calls)

  Produce a structured report with findings grouped by category and severity.

parameters:
  - key: target
    type: string
    required: true
    description: Repository path or directory to audit
    default: "."

max_turns: 10
timeout: "10m"

name: research
description: Research a topic using web search and summarize findings
agent: gemini
tags:
  - research
  - explore

system_prompt: |
  You are a research agent. Investigate the following topic thoroughly:

  Query: {{query}}

  Use web search to find current, authoritative sources. Provide:
  1. Executive summary (3-5 key findings)
  2. Detailed findings with source URLs
  3. Conflicting information or debates
  4. Gaps in available information
  5. Recommended next steps

parameters:
  - key: query
    type: string
    required: true
    description: Research topic or question
